# DRAFT for mindx-devOps (3 Oct 2026). Not used by the build.
#
# The live site is served by nginx on the AWS box (mindx-nginx-1, files in
# /opt/mindx/web). nginx ignores public/.htaccess, so the redirects written
# there never run: today /privacy-policy.html, /terms-of-service.html and
# /brain-scan all answer 200 with the home page instead of redirecting, and
# missing pages answer 200 instead of 404.
#
# These rules carry the .htaccess redirects over to nginx. Put them in the
# themindx.com server { } block, above the location that serves the site.
# Adjust `root` to the path the container mounts /opt/mindx/web at.
# The /app rule from .htaccess is not repeated: nginx already serves /app.

# Old URLs from the previous site and retired pages
location = /index.html            { return 301 /; }
location = /privacy-policy.html   { return 301 /privacy/; }
location = /terms-of-service.html { return 301 /terms/; }
location ~ ^/brain-scan/?$        { return 301 /signup/; }
location ~ ^/waitlist/?$          { return 301 /signup/; }

# The static site: exact file, then folder (index.html inside), else a real
# 404 with the site's own 404 page. nginx adds the trailing slash to folder
# URLs itself, which replaces the trailing-slash rule in .htaccess.
location / {
    root /usr/share/nginx/html;   # <- the container's path for /opt/mindx/web
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;

# Caching, as in .htaccess: HTML always revalidates, hashed assets are immutable.
location ~* \.html$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, must-revalidate";
}
location /_next/static/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
